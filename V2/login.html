<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | cellXion Ltd</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL      = 'https://doyacbaoeytnqivpsels.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gK-xj6a23FK1rUfAUf0R6Q_BCeji8aE';
    </script>
    <style>
        /* ── Login page layout ── */
        .login-wrap {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-dark);
            padding: 3.5rem;
            background: rgba(7, 7, 8, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .login-card-tag {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-red);
            margin-bottom: 2rem;
        }

        .login-card h2 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            line-height: 1;
        }

        .login-card > p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* Divider */
        .login-divider {
            width: 100%;
            height: 1px;
            background: var(--border-dark);
            margin-bottom: 2.5rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-dark);
            padding: 0.75rem 0;
            color: var(--text-white);
            font-family: var(--font-mono);
            font-size: 0.88rem;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.25s ease;
            caret-color: var(--accent-red);
        }

        .form-group input::placeholder {
            color: #333338;
        }

        .form-group input:focus {
            border-bottom-color: var(--accent-red);
        }

        /* Submit button — inherits .cta-btn but full-width */
        .login-btn {
            margin-top: 2rem;
            width: 100%;
            justify-content: space-between;
            padding: 0.9rem 0;
            font-size: 0.72rem;
            letter-spacing: 2.5px;
        }

        .login-btn::after {
            content: '→';
            font-size: 1rem;
        }

        .login-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Status message */
        #message {
            margin-top: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.6;
            min-height: 1.2em;
        }

        /* Logo mark in card */
        .login-logo {
            width: 36px;
            height: auto;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <header>
            <div class="logo">
                <img class="logo-img" src="images/x-png.png" alt="Logo">
                <div>
                    <span class="logo-text-main">CELLXION</span>
                    <p class="nav-secondary">Cellular Intelligence Solutions</p>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="solutions.html">QMTS</a></li>
                    <li><a href="gdpr.html">GDPR</a></li>
                    <li><a href="#" style="color: var(--accent-red);">Log in</a></li>
                </ul>
            </nav>
        </header>

        <div class="login-wrap">
            <div class="login-card">
                <img class="login-logo" src="images/x-png.png" alt="CellXion">
                <div class="login-card-tag">// Secure Access Portal</div>
                <h2>Client<br>Log In</h2>
                <p>Enter your email address to request temporary access credentials.</p>
                <div class="login-divider"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="your@email.com"
                            autocomplete="email"
                        >
                    </div>
                    <button type="submit" id="submit-btn" class="cta-btn login-btn">
                        Send Request
                    </button>
                </form>

                <div id="message"></div>
            </div>
        </div>

        <footer class="footer-info">
            <div>CELLXION LTD // GLOBAL OPERATIONS 2026</div>
            <div>DESIGN BY MATT STONE — IRON RAVEN STUDIO</div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ── Background: grid + particles, same as solutions/gdpr ──
        const scene    = new THREE.Scene();
        const camera   = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.set(0, 10, 35);

        const grid = new THREE.GridHelper(100, 40, 0x111113, 0x111113);
        grid.position.y = -5;
        scene.add(grid);

        const partGeo  = new THREE.BufferGeometry();
        const partPos  = new Float32Array(400 * 3);
        for (let i = 0; i < 400 * 3; i++) partPos[i] = (Math.random() - 0.5) * 80;
        partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        scene.add(new THREE.Points(partGeo, new THREE.PointsMaterial({
            size: 0.12, color: 0xff1a1a,
            transparent: true, opacity: 0.3,
            blending: THREE.AdditiveBlending
        })));

        let mouseX = 0;
        document.addEventListener('mousemove', e => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0004;
        });

        (function animate() {
            requestAnimationFrame(animate);
            grid.rotation.y += (mouseX - grid.rotation.y) * 0.04;
            renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Supabase auth logic (unchanged) ──
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const loginForm  = document.getElementById('login-form');
        const messageDiv = document.getElementById('message');
        const submitBtn  = document.getElementById('submit-btn');
        const baseUrl    = window.location.href.split('login.html')[0];
        const redirectUrl = baseUrl + 'dashboard.html';

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();

            messageDiv.style.color = 'rgba(255,255,255,0.5)';
            messageDiv.innerText   = '> VERIFYING AUTHORISATION...';
            submitBtn.disabled     = true;

            try {
                const { data: isAuthorized, error: rpcError } = await supabaseClient
                    .rpc('check_user_exists', { email_to_check: email });

                if (rpcError) throw new Error('SYSTEM ERROR: UNABLE TO REACH GATEKEEPER');
                if (!isAuthorized) throw new Error('ACCESS DENIED: EMAIL NOT RECOGNISED');

                const { error: authError } = await supabaseClient.auth.signInWithOtp({
                    email,
                    options: { emailRedirectTo: redirectUrl }
                });

                if (authError) throw authError;

                messageDiv.style.color = '#22c55e';
                messageDiv.innerText   = '> SUCCESS: MAGIC LINK TRANSMITTED TO INBOX';

            } catch (err) {
                messageDiv.style.color = 'var(--accent-red)';
                messageDiv.innerText   = '> ' + err.message;
                submitBtn.disabled     = false;
            }
        });
    </script>
</body>
</html>
